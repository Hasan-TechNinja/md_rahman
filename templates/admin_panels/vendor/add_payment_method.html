{% extends "unfold/layouts/base.html" %}

{% block title %}Add Payment Method{% endblock %}

{% block content %}
  <div class="py-6 px-4 sm:px-6 lg:px-8 max-w-3xl mx-auto">
    <div class="mb-8">
      <h1 class="text-2xl font-semibold text-gray-900 dark:text-white">Add New Card</h1>
      <p class="mt-2 text-gray-600 dark:text-gray-400">
        Enter your card details to save it securely for future use.
      </p>
    </div>

    {% if messages %}
      <div class="space-y-4 mb-6">
        {% for message in messages %}
          <div class="p-4 rounded-lg bg-{{ message.tags }}-100 text-{{ message.tags }}-800 dark:bg-{{ message.tags }}-900/30 dark:text-{{ message.tags }}-300 border border-{{ message.tags }}-200 dark:border-{{ message.tags }}-800">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <div class="bg-white dark:bg-gray-800 shadow-sm rounded-xl border border-gray-200 dark:border-gray-700 p-6">
      <form id="payment-form" class="space-y-6">
        <div id="payment-element" class="p-4 border border-gray-300 dark:border-gray-600 rounded-lg"></div>

        <!-- Error display -->
        <div id="error-message" class="hidden text-red-600 dark:text-red-400 text-sm"></div>

        <div class="flex items-center justify-end space-x-4">
          <a href="{% url 'admin:vendor_payment_methods' %}" class="px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-md">
            Cancel
          </a>
          <button type="submit" id="submit-btn" class="px-6 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed">
            Save Card
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Stripe.js + logic -->
  <script src="https://js.stripe.com/v3/"></script>
  <script>
    const stripe = Stripe('{{ stripe_publishable_key }}');
    const elements = stripe.elements();

    // Fetch SetupIntent client_secret
    fetch("{% url 'admin:create_setup_intent' %}", {
      method: 'POST',
      headers: {
        'X-CSRFToken': '{{ csrf_token }}',
        'Content-Type': 'application/json',
      },
    })
    .then(response => response.json())
    .then(data => {
      if (data.error) {
        document.getElementById('error-message').textContent = data.error;
        document.getElementById('error-message').classList.remove('hidden');
        return;
      }

      const paymentElement = elements.create('payment', {
        defaultValues: { billingDetails: { name: '{{ user.get_full_name }}' } }
      });
      paymentElement.mount('#payment-element');

      const form = document.getElementById('payment-form');
      const submitBtn = document.getElementById('submit-btn');
      const errorDiv = document.getElementById('error-message');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving...';
        errorDiv.classList.add('hidden');
        errorDiv.textContent = '';

        const { error, setupIntent } = await stripe.confirmSetup({
          elements,
          confirmParams: {
            return_url: window.location.origin + '{% url 'admin:vendor_payment_methods' %}',
          },
          redirect: 'if_required',  // stay on page if no redirect needed
        });

        if (error) {
          errorDiv.textContent = error.message;
          errorDiv.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Save Card';
        } else if (setupIntent.status === 'succeeded') {
          // Success → redirect back to list (or show success message)
          window.location.href = '{% url 'admin:vendor_payment_methods' %}';
        } else {
          // Rare cases (e.g. requires_action but no redirect)
          errorDiv.textContent = 'Setup processing – please check your email or try again.';
          errorDiv.classList.remove('hidden');
          submitBtn.disabled = false;
        }
      });
    })
    .catch(err => {
      console.error(err);
      document.getElementById('error-message').textContent = 'Failed to load payment form. Please try again.';
      document.getElementById('error-message').classList.remove('hidden');
    });
  </script>
{% endblock %}
